<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <style>
      .line {
        fill: none;
        stroke: #000000;
        stroke-width: 10;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Central Tire -->
  <circle cx="300" cy="160" r="80" class="line" />
  <circle cx="300" cy="160" r="30" class="line" />

  <!-- Left Deck / Footpad Rail -->
  <path d="M 60 140 L 225 140 L 225 180 L 60 180 Z" class="line" />

  <!-- Right Deck / Footpad Rail -->
  <path d="M 375 140 L 540 140 L 540 180 L 375 180 Z" class="line" />

  <!-- Front Bumper -->
  <path d="M 60 180 L 60 195 L 120 195" class="line" />

  <!-- Rear Bumper -->
  <path d="M 540 180 L 540 195 L 480 195" class="line" />

  <!-- Subtle Footpad Angle Accents -->
  <line x1="80" y1="140" x2="220" y2="140" class="line" />
  <line x1="380" y1="140" x2="520" y2="140" class="line" />
</svg>
